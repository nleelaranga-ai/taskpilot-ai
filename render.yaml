# Render Blueprint Specification for TaskPilot AI
# https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # Unified Web Service (Next.js Frontend + Streamable HTTP MCP Server)
  # Both processes run in one container over loopback (port 3333) & SQLite WAL
  # -------------------------------------------------------------
  - type: web
    name: taskpilot-ai
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TASKPILOT_MCP_URL
        value: http://127.0.0.1:3333/mcp
      - key: TASKPILOT_DB
        value: data/taskpilot.db
      - key: ALLOWED_ORIGINS
        value: "*"
